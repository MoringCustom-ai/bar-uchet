<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Учёт бара</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --fb-bg:#ffffff;--fb-bg2:#efeff4;--fb-tx:#111;--fb-hint:#8a8a8e;--fb-acc:#2f7cf6;--fb-acctx:#fff;
  --bg:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,var(--fb-bg)));
  --bg2:var(--tg-theme-secondary-bg-color,var(--fb-bg2));
  --tx:var(--tg-theme-text-color,var(--fb-tx));
  --hint:var(--tg-theme-hint-color,var(--fb-hint));
  --acc:var(--tg-theme-button-color,var(--fb-acc));
  --acctx:var(--tg-theme-button-text-color,var(--fb-acctx));
  --red:#e5484d;--amber:#d98a00;--green:#2f9e44;--line:rgba(127,127,127,.2);
}
@media (prefers-color-scheme:dark){:root{--fb-bg:#1c1c1e;--fb-bg2:#000;--fb-tx:#f2f2f7;--fb-hint:#8e8e93;--fb-acc:#3e88f7}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg2);color:var(--tx);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
header h1{font-size:20px;margin:0}
.sync{font-size:12px;color:var(--hint)}
.sync.err{color:var(--red)}
main{padding:8px 12px calc(140px + env(safe-area-inset-bottom))}
.card{background:var(--bg);border-radius:14px;padding:4px 14px;margin:10px 0}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);margin:12px 0 4px;font-weight:600}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--tx);padding:8px 4px;border-radius:8px;font:inherit;font-size:14px}
.seg button.on{background:var(--acc);color:var(--acctx)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:16px;padding:5px 12px;font:inherit;font-size:13px;white-space:nowrap}
.chip.on{border-color:var(--acc);color:var(--acc);font-weight:600}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:140px;font-size:13px}
.search{margin-top:10px;background:var(--bg)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.card h3+.row,.card .row:first-child{border-top:0}
.ri{flex:1;min-width:0}
.nm{font-weight:500;overflow-wrap:anywhere}
.sub{font-size:12.5px;color:var(--hint)}
.low .nm::after{content:" ●";color:var(--red);font-size:11px}
.bad{color:var(--red);font-weight:600}
.soon{color:var(--amber);font-weight:600}
.num{width:92px;flex:none;text-align:right;font-size:16px}
.num.filled{border-color:var(--acc);font-weight:600}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper .num{width:64px;text-align:center}
.pm{width:38px;height:40px;border:0;border-radius:10px;background:var(--bg2);color:var(--acc);font-size:22px;line-height:1;touch-action:manipulation}
.pm:active{background:var(--acc);color:var(--acctx)}
.val{flex:none;text-align:right;font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;background:var(--acc);color:var(--acctx);font:inherit;font-weight:600;margin:10px 0}
.btn.sec{background:var(--bg2);color:var(--acc)}
.btn.danger{background:none;color:var(--red)}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.mini{border:0;background:none;color:var(--acc);font:inherit;font-size:14px;padding:4px 0}
.x{border:0;background:none;color:var(--hint);font-size:18px;padding:0 4px}
.savebar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));padding:0 12px;z-index:5}
.savebar .btn{margin:0 0 8px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;border:0;background:none;color:var(--hint);font:inherit;font-size:11.5px;padding:7px 0 8px}
nav.tabs button b{display:block;font-size:20px;font-weight:400;line-height:1.2}
nav.tabs button.on{color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;color:var(--hint);font-weight:500;text-align:right;padding:6px 0 4px}
th:first-child,td:first-child{text-align:left}
td{padding:7px 0;border-top:1px solid var(--line);text-align:right;vertical-align:top}
td+td,th+th{padding-left:8px}
td.warn{color:var(--red);font-weight:600}
.empty{color:var(--hint);text-align:center;padding:18px 8px}
.hdr{display:flex;align-items:center;justify-content:space-between}
label{display:block;font-size:13px;color:var(--hint);margin:10px 0 0}
label input,label select{margin-top:4px}
.two{display:flex;gap:10px}.two>*{flex:1}
.note{font-size:12.5px;color:var(--hint);margin:6px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end}
#modal.on{display:flex}
#modal .sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:6px 16px calc(16px + env(safe-area-inset-bottom))}
#modal h3{margin:12px 0 4px;font-size:18px}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;z-index:30;display:none;max-width:90vw}
</style>
</head>
<body>
<header><h1>Учёт бара</h1><span class="sync" id="sync"></span></header>
<main id="view"></main>
<div class="savebar" id="savebar"></div>
<nav class="tabs" id="tabs">
  <button data-tab="input"><b>✎</b>Ввод</button>
  <button data-tab="order"><b>🛒</b>Заказ</button>
  <button data-tab="plan"><b>📅</b>План</button>
  <button data-tab="stats"><b>📊</b>Расход</button>
  <button data-tab="items"><b>☰</b>Позиции</button>
  <button data-tab="add"><b>＋</b>Добавить</button>
</nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
'use strict';
const TG = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(TG && TG.initData);
const CLOUD = IN_TG && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9') && !!TG.CloudStorage;

const CATS = {
  prep:   {n:'Заготовки', own:true},
  premix: {n:'Премиксы',  own:true},
  prod:   {n:'Продукты',  own:false},
  alc:    {n:'Алкоголь',  own:false},
};
const UNITS = ['л','кг']; // остатки считаем только в литрах и килограммах (в ТТК ингредиенты — в мл, г, шт как угодно)

// Состояние. События: [t (сек), id позиции, 'c' пересчёт | 'r' приход, кол-во], разложены по месяцам.
let S = {items:[], seq:1, invs:[], ev:{}, cfg:{}};
let H = {};
// Режим ввода: 'bar' — бармены берут на коктейли, 'prep' — заготовщик готовит, 'inv' — инвентаризация. Запоминается на устройстве
let tab = 'input', mode = 'prep', catF = 'all', q = '', period = 7;
try { const m0 = localStorage.getItem('barinv:mode'); if (['bar','prep','inv'].includes(m0)) mode = m0; } catch(e) {}
const VIEWS = {}; // экраны
const ACT = {};   // обработчики кнопок data-act
const drafts = {bar:{}, prep:{}, inv:{}};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Math.floor(Date.now()/1000);
const monthOf = t => { const d = new Date(t*1000); return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0'); };
const fmt = x => x == null || isNaN(x) ? '—' : (Math.round(x*100)/100).toLocaleString('ru-RU');
const fmtD = t => new Date(t*1000).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'});
const fmtDT = t => fmtD(t) + ' ' + new Date(t*1000).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
const isNum = v => v !== null && v !== '' && v !== undefined && !isNaN(v);

// «1,5» или «2+0,7» — удобно считать несколько ёмкостей сразу
function num(v){
  v = String(v ?? '').replace(/\s/g,'').replace(/,/g,'.');
  if (v === '') return null;
  let s = 0;
  for (const p of v.split('+')) { if (p === '' || isNaN(p)) return NaN; s += Number(p); }
  return Math.round(s*1000)/1000;
}

/* ---------- хранилище ---------- */
const LS = 'barinv:';
const lsGet = k => { try { return localStorage.getItem(LS+k); } catch(e) { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(LS+k, v); } catch(e) {} };
const cs = {
  get: keys => new Promise((res,rej) => TG.CloudStorage.getItems(keys, (e,v) => e ? rej(e) : res(v || {}))),
  set: (k,v) => new Promise((res,rej) => TG.CloudStorage.setItem(k, v, (e,ok) => e ? rej(e) : res(ok))),
  del: keys => new Promise((res,rej) => TG.CloudStorage.removeItems(keys, (e,ok) => e ? rej(e) : res(ok))),
};
const CHUNK = 2000; // лимит CloudStorage 4096 на значение, берём с запасом под кириллицу

async function cloudSave(name, str){
  const n = Math.max(1, Math.ceil(str.length/CHUNK));
  const old = parseInt((await cs.get([name]))[name]) || 0;
  const jobs = [];
  for (let i = 0; i < n; i++) jobs.push(cs.set(name+'_'+i, str.slice(i*CHUNK, (i+1)*CHUNK)));
  await Promise.all(jobs);
  await cs.set(name, String(n));
  if (old > n) { const r = []; for (let i = n; i < old; i++) r.push(name+'_'+i); await cs.del(r); }
}
async function cloudLoad(name, meta){
  const n = parseInt(meta) || 0;
  if (!n) return null;
  const keys = []; for (let i = 0; i < n; i++) keys.push(name+'_'+i);
  const v = await cs.get(keys);
  return keys.map(k => v[k] || '').join('');
}

function dsStr(name){
  if (name === 'it') return JSON.stringify({items:S.items, seq:S.seq, cfg:S.cfg});
  if (name === 'iv') return JSON.stringify(S.invs);
  if (name === 'mo') return JSON.stringify(Object.keys(S.ev).sort());
  return JSON.stringify(S.ev[name.slice(1)] || []);
}
function applyDs(name, str){
  if (str == null) return;
  let v; try { v = JSON.parse(str); } catch(e) { return; }
  if (name === 'it') { S.items = v.items || []; S.seq = v.seq || 1; S.cfg = v.cfg || {}; }
  else if (name === 'iv') S.invs = v || [];
  else if (name[0] === 'e') S.ev[name.slice(1)] = v || [];
}

let saveChain = Promise.resolve();
function persist(names){
  names = [...new Set(names)];
  names.forEach(n => lsSet(n, dsStr(n)));
  if (!CLOUD) return;
  setSync('saving');
  saveChain = saveChain
    .then(() => Promise.all(names.map(n => cloudSave(n, dsStr(n)))))
    .then(() => setSync('ok'))
    .catch(() => { setSync('err'); toast('Не удалось сохранить в облако Telegram — данные остались на телефоне'); });
}
const allNames = () => ['it','iv','mo', ...Object.keys(S.ev).map(m => 'e'+m)];

function loadLocal(){
  applyDs('it', lsGet('it')); applyDs('iv', lsGet('iv'));
  let months = []; try { months = JSON.parse(lsGet('mo') || '[]'); } catch(e) {}
  months.forEach(m => applyDs('e'+m, lsGet('e'+m)));
}
async function loadCloud(){
  setSync('saving');
  try {
    const meta = await cs.get(['it','iv','mo']);
    if (!meta.it) { // облако пустое — выгружаем то, что есть локально
      if (S.items.length) persist(allNames()); else setSync('ok');
      return;
    }
    const fresh = {items:[], seq:1, invs:[], ev:{}, cfg:{}};
    const keep = S; S = fresh;
    try {
      applyDs('it', await cloudLoad('it', meta.it));
      applyDs('iv', await cloudLoad('iv', meta.iv));
      const months = JSON.parse(await cloudLoad('mo', meta.mo) || '[]');
      if (months.length) {
        const mm = await cs.get(months.map(m => 'e'+m));
        for (const m of months) applyDs('e'+m, await cloudLoad('e'+m, mm['e'+m]));
      }
    } catch(e) { S = keep; throw e; }
    allNames().forEach(n => lsSet(n, dsStr(n)));
    setSync('ok');
    rebuild(); render();
  } catch(e) { setSync('err'); }
}
function setSync(st){
  const el = $('#sync');
  el.className = 'sync' + (st === 'err' ? ' err' : '');
  el.textContent = !CLOUD ? 'на этом устройстве' : st === 'saving' ? 'синхронизация…' : st === 'err' ? 'ошибка облака' : 'сохранено в Telegram';
}

/* ---------- расчёты ---------- */
function rebuild(){
  H = {};
  for (const m in S.ev) for (const e of S.ev[m]) (H[e[1]] || (H[e[1]] = [])).push(e);
  for (const id in H) H[id].sort((a,b) => a[0]-b[0]); // сортировка стабильная — в одну секунду порядок ввода сохраняется
}
// Текущий остаток = последний пересчёт + приходы после него (до первого пересчёта — с нуля)
function stockAt(id, t = Infinity){
  let s = null;
  for (const e of H[id] || []) { if (e[0] > t) break; if (e[2] === 'm') continue; if (e[2] === 'c') s = e[3]; else s = (s ?? 0) + e[3]; }
  return s;
}
const lastCount = id => { const h = H[id] || []; for (let i = h.length-1; i >= 0; i--) if (h[i][2] === 'c') return h[i]; return null; };
// Расход между соседними пересчётами: было + пришло − стало
function intervals(id){
  const out = []; let prev = null, rin = 0;
  for (const e of H[id] || []) {
    if (e[2] === 'm') continue;
    if (e[2] !== 'c') { if (prev) rin += e[3]; }
    else { if (prev) out.push({a:prev[0], b:e[0], cons:prev[3] + rin - e[3]}); prev = e; rin = 0; }
  }
  return out;
}
// Средний расход в день за последние N дней (если данных за окно нет — за всё время)
function dailyRate(id, days){
  const iv = intervals(id).filter(x => x.b > x.a);
  if (!iv.length) return null;
  const t1 = now(), t0 = t1 - days*86400;
  let cons = 0, cov = 0;
  for (const x of iv) {
    const o = Math.min(x.b, t1) - Math.max(x.a, t0);
    if (o > 0) { cons += x.cons * o/(x.b - x.a); cov += o; }
  }
  if (cov < 6*3600) { cons = 0; cov = 0; for (const x of iv) { cons += x.cons; cov += x.b - x.a; } }
  return cov > 0 ? cons/cov*86400 : null;
}
function needs(it, s){
  if (s == null || !isNum(it.par)) return false;
  return isNum(it.min) ? s <= it.min : s < it.par;
}
function orderQty(it, s){
  let qn = it.par - s;
  if (qn <= 0) return 0;
  if (isNum(it.mult) && it.mult > 0) return Math.ceil(qn/it.mult - 1e-9) * it.mult;
  if (['шт','бут','уп','порц'].includes(it.u)) return Math.ceil(qn - 1e-9);
  return Math.round(qn*100)/100;
}
// Партии на остатке по FIFO: приход (приготовил) — новая партия, пересчёт списывает самые старые.
// t партии — когда ставили маркировку: при приготовлении или при перемаркировке ('m' — переклеили на всё, что есть)
function batches(id){
  const b = [];
  for (const e of H[id] || []) {
    if (e[2] === 'm') { b.forEach(x => x.t = e[0]); continue; }
    if (e[2] !== 'c') { b.push({t: e[2] === 'r' ? e[0] : null, q: e[3]}); continue; } // 'h' — приход из истории таблицы, дата партии неизвестна
    const total = b.reduce((a,x) => a + x.q, 0);
    if (e[3] > total + 1e-6) b.unshift({t: null, q: e[3] - total}); // остаток, дата приготовления которого неизвестна
    else {
      let rm = total - e[3];
      while (rm > 1e-6 && b.length) { if (b[0].q <= rm + 1e-6) { rm -= b[0].q; b.shift(); } else { b[0].q -= rm; rm = 0; } }
    }
  }
  return b.filter(x => x.q > 1e-6);
}
/* ---------- график барбэка (настраивается во вкладке «План») ---------- */
const WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const WEEK = [1,2,3,4,5,6,0];                          // порядок показа: с понедельника
const workDays = () => S.cfg.workDays || [3,4,5,6];    // барбэк на смене: Ср–Сб
const mainDays = () => S.cfg.mainDays || [3,4];        // основные заготовки: Ср, Чт
const relDays  = () => S.cfg.relDays  || [3,6];        // перемаркировка: Ср, Сб
const dayStart = t => { const d = new Date(t*1000); d.setHours(0, 0, 0, 0); return d.getTime()/1000; };
const addDays = (t, n) => { const d = new Date(t*1000); d.setDate(d.getDate() + n); return d.getTime()/1000; };
const wdOf = t => new Date(t*1000).getDay();
const fmtDay = t => `${WD[wdOf(t)]} ${fmtD(t)}`;
// Маркировку меняют по графику, а не по часам: этикетку, поставленную в made и годную до exp, переклеивают
// в последний день перемаркировки после дня made и не позже exp; если такого нет — в первый день перемаркировки после made
function relabelDayFor(made, exp){
  const rd = relDays();
  if (!rd.length) return null;
  let d = addDays(dayStart(made), 1), best = null;
  for (; d <= exp; d = addDays(d, 1)) if (rd.includes(wdOf(d))) best = d;
  if (best != null) return best;
  for (let i = 0; i < 7; i++, d = addDays(d, 1)) if (rd.includes(wdOf(d))) return d;
  return null;
}
const bySchedule = it => it.lh >= 24 && relDays().length > 0; // фреши (12 ч) переклеивают по времени, на смене

// Маркировка: когда пора переклеить самую старую партию. Срок — не списание, а смена маркировки
function shelf(it){
  if (!(it.lh > 0)) return null;
  let first = null;
  for (const x of batches(it.id)) {
    if (x.t == null) continue;
    const exp = x.t + it.lh*3600;
    if (!first || exp < first.exp) first = {exp, q: x.q, made: x.t};
  }
  if (!first) return null;
  if (bySchedule(it)) {
    const due = relabelDayFor(first.made, first.exp), today = dayStart(now());
    if (due != null) return {...first, due, st: today >= due ? 'bad' : due - today <= 3*86400 ? 'soon' : 'ok'};
  }
  const left = first.exp - now();
  return {...first, st: left <= 0 ? 'bad' : left < Math.min(86400, it.lh*3600*0.3) ? 'soon' : 'ok'};
}
const fmtLife = h => h < 24 ? fmt(h) + ' ч' : fmt(h/24) + ' сут';
const fmtExp = (it, t) => it.lh < 24*7 ? fmtDT(t) : fmtD(t);
const relabelBtn = it => `<button class="mini" data-act="relabel" data-id="${it.id}">Перемаркировал</button>`;
function shelfText(it, sh){
  if (!sh) return '';
  if (sh.st === 'bad') return ` · <span class="bad">${sh.due === dayStart(now()) ? 'перемаркировать сегодня' : 'пора перемаркировать'}</span> ${relabelBtn(it)}`;
  if (sh.due != null) return ` · <span class="${sh.st === 'soon' ? 'soon' : ''}">перемаркировка ${fmtDay(sh.due)}</span>`;
  return ` · <span class="${sh.st === 'soon' ? 'soon' : ''}">маркировка до ${fmtExp(it, sh.exp)}</span>`;
}
ACT.relabel = b => {
  const it = S.items.find(i => i.id === +b.dataset.id);
  if (!it) return;
  const t = now(), m = monthOf(t);
  (S.ev[m] || (S.ev[m] = [])).push([t, it.id, 'm', 0]);
  rebuild(); persist(['e'+m, 'mo']); haptic('success');
  const next = bySchedule(it) ? relabelDayFor(t, t + it.lh*3600) : null;
  toast(`${it.n}: ` + (next != null ? `следующая перемаркировка ${fmtDay(next)}` : `новая маркировка до ${fmtExp(it, t + it.lh*3600)}`));
  render();
  const el = $('#reclabel'); // открыто окно ТТК этой позиции — обновить строку маркировки
  if (el && recId === it.id) el.innerHTML = recLabelHtml(it);
};
// Строка маркировки в окне ТТК: когда переклеивать и кнопка подтверждения (нажать можно в любой момент)
function recLabelHtml(it){
  if (!(it.lh > 0)) return '';
  const sh = shelf(it);
  let txt;
  if (!sh) txt = '<span class="sub">дата неизвестна — нажми, когда переклеишь, и отсчёт начнётся</span>';
  else if (sh.st === 'bad') txt = `<span class="bad">${sh.due === dayStart(now()) ? 'перемаркировать сегодня' : 'пора перемаркировать'}</span>`;
  else txt = `<span class="${sh.st === 'soon' ? 'soon' : 'sub'}">${sh.due != null ? 'перемаркировка ' + fmtDay(sh.due) : 'до ' + fmtExp(it, sh.exp)}</span>`;
  return `<div class="row"><div class="ri"><div class="nm">Маркировка · каждые ${fmtLife(it.lh)}</div><div class="sub">${sh ? `стоит с ${fmtDT(sh.made)} · ` : ''}${txt}</div></div><button class="btn" style="width:auto;margin:0;padding:9px 12px" data-act="relabel" data-id="${it.id}">Перемаркировал</button></div>`;
}
ACT.relabelAll = () => {
  const t = now(), m = monthOf(t);
  const due = S.items.filter(it => { const sh = shelf(it); return sh && sh.st === 'bad'; });
  if (!due.length) return;
  (S.ev[m] || (S.ev[m] = [])).push(...due.map(it => [t, it.id, 'm', 0]));
  rebuild(); persist(['e'+m, 'mo']); haptic('success');
  toast(`Перемаркировано: ${due.length}`);
  render();
};
/* ТТК: it.rec = {out: выход в мл на 1 ед., ing: [[название, кол-во, ед.]]} */
const hasRec = it => !!(it.rec && it.rec.ing && it.rec.ing.length);
const fmtQ = x => fmt(x >= 20 ? Math.round(x) : Math.round(x*10)/10);
function parseIng(line){
  const p = line.split(/\t|;/).map(s => s.trim());
  if (!p[0]) return null;
  const m = (p[1] || '').match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
  if (m) return [p[0], num(m[1]), p[2] || m[2]];
  return [p[0], null, p[2] || p[1] || ''];
}
const ingLine = ([n, qn, u]) => `${n}; ${qn == null ? '' : String(qn).replace('.', ',')}; ${u}`;
// Разделы идут в порядке списка позиций (как в листе «ОСТАТКИ»), без раздела — по категории
const secOf = it => it.g || CATS[it.c].n;
function bySec(list){
  const m = new Map();
  for (const it of list) { const k = secOf(it); if (!m.has(k)) m.set(k, []); m.get(k).push(it); }
  return [...m];
}
// Ставит позицию в конец её раздела
function placeItem(it){
  S.items = S.items.filter(x => x !== it);
  let last = -1;
  S.items.forEach((x, i) => { if (secOf(x) === secOf(it)) last = i; });
  if (last < 0) S.items.push(it); else S.items.splice(last + 1, 0, it);
}

VIEWS.input = () => {

    <button class="btn sec" data-act="sample">Загрузить пример</button></div>`;
  const hint = {

    prep: 'Для заготовщика. «+» — приготовил галочку: сохраняется сразу, ингредиенты по ТТК списываются сами, с этого момента идёт маркировка. «−» — только исправить свой ошибочный «+» (в течение 2 минут). Число + «Сохранить»: стало больше — разница запишется как приготовленное.',

    </div>
    <div class="chips">${[['all','Все'], ...cats.map(([k,c]) => [k, c.n])].map(([k,n]) => `<button class="chip ${catF === k ? 'on' : ''}" data-act="cat" data-v="${k}">${n}</button>`).join('')}</div>
    <input class="search" id="q" placeholder="Поиск" value="${esc(q)}" autocomplete="off">

};
// Что видно барменам: заготовки и премиксы, кроме разделов, которые на бар не идут (настои, сувид б/а, варка).
// Для отдельной позиции можно переопределить галочкой «Показывать в „Бар“» (it.bar)
const BAR_HIDDEN = ['Сувид и инфьюзы', 'Сувид б/а', 'Варка'];
const inBar = it => CATS[it.c].own && (typeof it.bar === 'boolean' ? it.bar : !BAR_HIDDEN.includes(it.g || ''));
function inputList(){
  const d = drafts[mode];
  const ql = q.trim().toLowerCase();
  const list = S.items.filter(i => (mode !== 'bar' || inBar(i)) && (catF === 'all' || i.c === catF) && (!ql || i.n.toLowerCase().includes(ql)));
  if (!list.length) return `<div class="card"><div class="empty">Ничего не найдено</div></div>`;
  return bySec(list).map(([g, items]) => `<div class="card"><h3>${esc(g)}</h3>${items.map(it => {
    const s = stockAt(it.id), lc = lastCount(it.id);
    let sub = `сейчас ${s == null ? '—' : fmt(s) + ' ' + esc(it.u)}`;
    if (it.step > 0 && s != null) sub += ` (${fmt(Math.round(s/it.step*10)/10)} ✅)`;
    if (isNum(it.par)) sub += ` · норма ${fmt(it.par)}`;
    if (lc) sub += ` · посч. ${fmtD(lc[0])}`;
    sub += shelfText(it, shelf(it));
    // в поле серым — текущий остаток; ± меняют его на одну «галочку»
    const ph = s == null ? it.u : fmt(s);
    const st = stepOf(it);
    const inp = `<input class="num ${d[it.id] ? 'filled' : ''}" data-id="${it.id}" inputmode="decimal" enterkeyhint="next" placeholder="${esc(ph)}" value="${esc(d[it.id] || '')}" autocomplete="off">`;
    return `<div class="row ${needs(it, s) ? 'low' : ''}"><div class="ri"><div class="nm">${esc(it.n)}</div><div class="sub">${sub}${hasRec(it) ? ` · <button class="mini" data-act="rec" data-id="${it.id}">ТТК</button>` : ''}</div></div>
      ${st ? `<div class="stepper"><button class="pm" data-act="bump" data-id="${it.id}" data-dir="-1" aria-label="Минус">−</button>${inp}<button class="pm" data-act="bump" data-id="${it.id}" data-dir="1" aria-label="Плюс">+</button></div>` : inp}</div>`;
  }).join('')}</div>`).join('');
}
// Шаг кнопок ±: «галочка» позиции; без галочки ± нет — только ввод числом
const stepOf = it => it.step > 0 ? it.step : 0;
// В «Остатках» ± сохраняются сразу: − «ушла галочка» (новый остаток), + «приготовил галочку» (приход).
// Нажатия по одной позиции в течение 2 минут склеиваются в одну запись, обратная кнопка исправляет ошибку, а не пишет новое событие.
const TAP_MERGE = 120;
const lastTap = {}; // id -> {t, kind, ev, base}
let tapTimer = null, tapNames = new Set();
function persistSoon(names){
  names.forEach(n => tapNames.add(n));
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { persist([...tapNames]); tapNames = new Set(); }, 800);
}
const r3 = x => Math.round(x*1000)/1000;
const dropEv = e => { for (const k in S.ev) { const i = S.ev[k].indexOf(e); if (i >= 0) S.ev[k].splice(i, 1); } };

/* Автосписание по ТТК: приготовил позицию — ингредиенты, которые есть в списке позиций, уменьшаются сами */
const normName = s => String(s).toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
const ingItem = n => S.items.find(i => normName(i.n) === normName(n));
const UNIT_K = {'мл': 0.001, 'г': 0.001, 'л': 1, 'кг': 1}; // мл и г считаем одинаково (плотность ≈ 1)
// [{it, per}] — сколько ингредиента (в его единицах) уходит на 1 ед. готового; без выхода в ТТК не списываем
function deductPlan(it){
  if (!hasRec(it) || !byVol(it)) return [];
  const batchPerUnit = VOL[it.u] / it.rec.out;
  const out = [];
  for (const [n, qn, u] of it.rec.ing) {
    const k = UNIT_K[String(u || '').trim()], ing = ingItem(n);
    if (qn == null || !k || !ing || ing === it) continue;
    out.push({it: ing, per: qn * k * batchPerUnit});
  }
  return out;
}
// Записывает списание на q ед. готового в момент t; возвращает связанные записи, чтобы их можно было поправить
function deduct(it, q, t){
  const m = monthOf(t), deps = [];
  for (const d of deductPlan(it)) {
    const s = stockAt(d.it.id);
    if (s == null) continue; // остаток ингредиента ещё ни разу не вносили — списывать не из чего
    const e = [t, d.it.id, 'c', r3(Math.max(0, s - d.per*q)), it.id];
    (S.ev[m] || (S.ev[m] = [])).push(e);
    deps.push({ev: e, base: s, per: d.per});
  }
  return deps;
}
const syncDeps = (deps, q) => deps.forEach(d => d.ev[3] = r3(Math.max(0, d.base - d.per*q)));
const depsText = (it, deps) => deps.length ? ` · списано: ${deps.map(d => `${S.items.find(i => i.id === d.ev[1]).n} ${fmt(r3(d.base - d.ev[3]))} ${S.items.find(i => i.id === d.ev[1]).u}`).join(', ')}` : '';

// Бар: «−» — взял (расход), «+» — только отменить свой недавний «−».
// Заготовка: «+» — приготовил (приход + списание по ТТК), «−» — только отменить свой недавний «+».
function tap(it, dir, st, role){
  const id = it.id, t = now(), m = monthOf(t), key = role + ':' + id;
  const s = stockAt(id) ?? 0;
  const lt = lastTap[key];
  const live = lt && t - lt.t < TAP_MERGE && Object.values(S.ev).some(a => a.includes(lt.ev));
  const drop = () => { dropEv(lt.ev); (lt.deps || []).forEach(d => dropEv(d.ev)); delete lastTap[key]; };
  const push = (kind, q, base) => { const e = [t, id, kind, q]; (S.ev[m] || (S.ev[m] = [])).push(e); return lastTap[key] = {t, kind, ev: e, base, deps: []}; };
  if (role === 'bar') {
    if (dir < 0) {
      if (s <= 1e-9) { toast('Уже ноль'); return false; }
      if (live) { lt.ev[3] = r3(Math.max(0, lt.ev[3] - st)); lt.t = t; }
      else push('c', r3(Math.max(0, s - st)), s);
    } else {
      if (!live) { toast('«+» в баре — только отменить свой «−». Приготовленное отмечают во «Заготовке»'); return false; }
      lt.ev[3] = r3(lt.ev[3] + st); lt.t = t;
      if (lt.ev[3] >= lt.base - 1e-9) drop();
    }
  } else {
    if (dir > 0) {
      if (live) { lt.ev[3] = r3(lt.ev[3] + st); lt.t = t; syncDeps(lt.deps, lt.ev[3]); }
      else { const p = push('r', st); p.deps = deduct(it, st, t); }
    } else {
      if (!live) { toast('«−» в заготовке — только отменить свой «+». Расход отмечают бармены во вкладке «Бар»'); return false; }
      lt.ev[3] = r3(lt.ev[3] - st); lt.t = t; syncDeps(lt.deps, lt.ev[3]);
      if (lt.ev[3] <= 1e-9) drop();
    }
  }
  rebuild(); persistSoon(['e'+m, 'mo']);
  const cur = lastTap[key];
  if (role === 'prep' && cur && cur.deps.length) toast(`${it.n}: +${fmt(cur.ev[3])} ${it.u}${depsText(it, cur.deps)}`);
  return true;
}
ACT.bump = b => {
  const id = b.dataset.id, it = S.items.find(i => i.id === +id), st = stepOf(it);
  if (!st) return;
  if (mode !== 'inv') {
    delete drafts[mode][id];
    if (tap(it, +b.dataset.dir, st, mode)) { try { TG.HapticFeedback.selectionChanged(); } catch(e) {} }
    $('#list').innerHTML = inputList(); updateSaveBar();
    return;
  }
  const d = drafts[mode];
  let base = num(d[id]);
  if (base == null || Number.isNaN(base)) base = stockAt(it.id) ?? 0;
  const v = Math.max(0, Math.round((base + +b.dataset.dir * st)*1000)/1000);
  d[id] = String(v).replace('.', ',');
  const el = document.querySelector(`#list .num[data-id="${id}"]`);
  if (el) { el.value = d[id] || ''; el.classList.toggle('filled', !!d[id]); }
  try { TG.HapticFeedback.selectionChanged(); } catch(e) {}
  updateSaveBar();
};
function updateSaveBar(){
  const bar = $('#savebar');
  if (tab !== 'input' || !S.items.length) { bar.innerHTML = ''; return; }
  const n = Object.values(drafts[mode]).filter(v => String(v).trim() !== '').length;
  const label = {bar:'Сохранить остатки', prep:'Сохранить остатки', inv:`Сохранить инвентаризацию · ${n} из ${S.items.length}`}[mode];
  bar.innerHTML = `<button class="btn" data-act="save" ${n ? '' : 'disabled'}>${label}${mode !== 'inv' && n ? ` (${n})` : ''}</button>`;
}
ACT.mode = b => {
  mode = b.dataset.v;
  if (mode === 'inv' || (mode === 'bar' && catF !== 'all' && !CATS[catF].own)) catF = 'all';
  try { localStorage.setItem('barinv:mode', mode); } catch(e) {}
  render();
};
ACT.cat = b => { catF = b.dataset.v; render(); };
ACT.gotab = b => { tab = b.dataset.v; render(); };
ACT.save = async () => {
  const d = drafts[mode], t = now(), m = monthOf(t), add = [];
  let counted = 0, made = 0;
  for (const id in d) {
    const v = num(d[id]);
    if (v === null) continue;
    const it = S.items.find(i => i.id == id);
    if (!it) continue;
    if (isNaN(v) || v < 0) { toast(`Проверь число: «${it.n}»`); return; }
    // стало больше, чем было — приготовил или пришла поставка: разницу пишем приходом (с неё же начинается маркировка).
    // В «Баре» число — просто пересчёт: бармены не готовят
    const s = stockAt(it.id);
    if (mode !== 'bar' && s != null && v > s + 1e-9) { add.push([t, +id, 'r', r3(v - s)]); deduct(it, r3(v - s), t); made++; }
    add.push([t, +id, 'c', v]);
    counted++;
  }
  if (!counted) return;
  if (mode === 'inv') {
    const missing = S.items.length - counted;
    if (missing > 0 && !await ask(`Не заполнено ${missing} поз. Сохранить инвентаризацию без них?`)) return;
    S.invs.push({t});
  }
  (S.ev[m] || (S.ev[m] = [])).push(...add);
  drafts[mode] = {};
  rebuild();
  persist(['e'+m, 'mo', ...(mode === 'inv' ? ['iv'] : [])]);
  haptic('success');
  toast((mode === 'inv' ? 'Инвентаризация сохранена' : 'Остатки сохранены') + (made ? ` · приготовлено/пришло: ${made} поз.` : ''));
  render();
  window.scrollTo(0, 0);
};

// Мелкие количества в г / мл: 0,133 кг → 133 г
const fmtU = (q, u) => (u === 'кг' || u === 'л') && q > 0 && q < 1 ? `${Math.round(q*1000)} ${u === 'кг' ? 'г' : 'мл'}` : `${fmt(q)} ${u}`;
// Что приготовить и что заказать. Приготовить — по нормам; заказать — по нормам плюс ингредиенты по ТТК
// для того, что надо приготовить (нет миндаля, а нужно орже — закажи миндаль). Своя заготовка-ингредиент
// (лайм кордиал для Кавай) тоже попадает в «Приготовить», и её ингредиенты — в заказ.
function orderCalc(){
  const make = new Map(); // заготовка -> {qn, for: Set названий, для чего}
  const roundUp = (it, x) => { const st = it.step > 0 ? it.step : 0.01; return r3(Math.ceil(x/st - 1e-9)*st); };
  for (const it of S.items) {
    if (!CATS[it.c].own) continue;
    const s = stockAt(it.id);
    if (s == null || !needs(it, s)) continue;
    const qn = orderQty(it, s);
    if (qn > 0) make.set(it, {qn, for: new Set()});
  }
  let use = new Map(); // ингредиент -> {q, for}
  for (let pass = 0; pass < 6; pass++) {
    use = new Map();
    for (const [it, m] of make) for (const d of deductPlan(it)) {
      const u = use.get(d.it) || {q: 0, for: new Set()};
      u.q += d.per * m.qn; u.for.add(it.n); use.set(d.it, u);
    }
    let changed = false;
    for (const [ing, u] of use) {
      if (!CATS[ing.c].own) continue;
      const s = stockAt(ing.id);
      if (s == null) continue;
      const left = s - u.q; // сколько останется после заготовок
      const want = isNum(ing.par) && needs(ing, Math.max(0, left)) ? ing.par - left : -left;
      if (want <= 1e-9) continue;
      const qn = roundUp(ing, want), cur = make.get(ing);
      if (!cur || cur.qn + 1e-9 < qn) { make.set(ing, {qn, for: new Set([...(cur ? cur.for : []), ...u.for])}); changed = true; }
      else u.for.forEach(f => cur.for.add(f));
    }
    if (!changed) break;
  }
  const buy = [];
  for (const it of S.items) {
    if (CATS[it.c].own) continue;
    const s = stockAt(it.id), u = use.get(it);
    if (s == null) { if (u) buy.push({it, s, qn: roundUp(it, u.q), use: u, unknown: true}); continue; }
    const left = s - (u ? u.q : 0);
    const want = isNum(it.par) && needs(it, Math.max(0, left)) ? it.par - left : -left;
    if (want <= 1e-9) continue;
    const qn = isNum(it.mult) && it.mult > 0 ? Math.ceil(want/it.mult - 1e-9)*it.mult : roundUp(it, want);
    buy.push({it, s, qn, use: u});
  }
  return {make: [...make].map(([it, m]) => ({it, s: stockAt(it.id), qn: m.qn, for: m.for})), buy};
}

VIEWS.order = () => {
  if (!S.items.length) return `<div class="card"><div class="empty">Сначала добавь позиции</div></div>`;
  const exp = [], nodata = [];
  for (const it of S.items) {
    const sh = shelf(it);
    if (sh && sh.st !== 'ok') exp.push({it, sh});
    if (CATS[it.c].own && stockAt(it.id) == null && isNum(it.par)) nodata.push(it);
  }
  const {make, buy: buyRows} = orderCalc();
  const buy = {};
  for (const r of buyRows) (buy[r.it.sup || 'Без поставщика'] || (buy[r.it.sup || 'Без поставщика'] = [])).push(r);
  TXT.length = 0;
  const forTxt = set => set && set.size ? [...set].join(', ') : '';
  const makeLine = r => `<div class="row" ${hasRec(r.it) ? `data-act="rec" data-id="${r.it.id}" data-k="${r.qn}"` : ''}><div class="ri"><div class="nm">${esc(r.it.n)}</div><div class="sub">есть ${fmt(r.s)}${isNum(r.it.par) ? ` · норма ${fmt(r.it.par)}` : ''}${r.for.size ? ` · нужно для: ${esc(forTxt(r.for))}` : ''}</div></div><div class="val">${fmt(r.qn)} ${esc(r.it.u)}${hasRec(r.it) ? '<div class="mini">ТТК ›</div>' : ''}</div></div>`;
  const buyLine = r => `<div class="row ${r.unknown ? 'low' : ''}"><div class="ri"><div class="nm">${esc(r.it.n)}</div><div class="sub">${r.unknown ? '<span class="soon">остаток не внесён — проверь</span>' : `есть ${fmtU(r.s, r.it.u)}`}${isNum(r.it.par) ? ` · норма ${fmtU(r.it.par, r.it.u)}` : ''}${r.use ? ` · на заготовки ${fmtU(r3(r.use.q), r.it.u)} (${esc(forTxt(r.use.for))})` : ''}</div></div><div class="val">${fmtU(r.qn, r.it.u)}</div></div>`;
  const block = (title, rows, line, text) => {
    const i = TXT.push(text) - 1;
    return `<div class="card"><div class="hdr"><h3>${esc(title)}</h3><span><button class="mini" data-act="copy" data-i="${i}">Копировать</button>${IN_TG ? ` · <button class="mini" data-act="share" data-i="${i}">Отправить</button>` : ''}</span></div>${rows.map(line).join('')}</div>`;
  };
  const today = new Date().toLocaleDateString('ru-RU');
  const pos = new Map(S.items.map((it, i) => [it, i]));
  const sortN = a => a.sort((x,y) => pos.get(x.it) - pos.get(y.it));
  let html = '';
  if (exp.length) {
    exp.sort((a,b) => (a.sh.due ?? a.sh.exp) - (b.sh.due ?? b.sh.exp));
    const due = exp.filter(x => x.sh.st === 'bad').length;

/* ---------- план на неделю по последним 14 дням ---------- */
const WINDOW = 14;            // сколько дней истории берём
const PREP_H = 12;            // во сколько обычно готовишь (для времени маркировки)
const SHIFT = 6*3600;         // бар работает за полночь: до 6 утра — ещё вчерашний день
// Сколько дней данных накоплено (максимум 14)
function dataDays(){
  let first = Infinity;
  for (const m in S.ev) for (const e of S.ev[m]) if (e[2] !== 'm' && e[0] < first) first = e[0];
  return first === Infinity ? 0 : Math.min(WINDOW, Math.floor((now() - first)/86400));
}
// Загрузка по дням недели (1 — средний день, 1,5 — в полтора раза больше): по всем заготовкам вместе
function wdFactors(){
  const t1 = now(), t0 = t1 - WINDOW*86400;
  const cnt = Array(7).fill(0);
  for (let t = t0 + 43200; t < t1; t += 86400) cnt[new Date((t - SHIFT)*1000).getDay()]++;
  const acc = Array(7).fill(0);
  let used = 0;
  for (const it of S.items) {
    const per = Array(7).fill(0);
    let tot = 0;
    for (const x of intervals(it.id)) {
      if (!(x.b > x.a) || x.cons <= 0) continue;
      let a = Math.max(x.a, t0); const b = Math.min(x.b, t1), k = x.cons/(x.b - x.a);
      while (a < b) { // раскладываем расход интервала по барным дням
        const d = new Date((a - SHIFT)*1000);
        const e = Math.min(b, new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime()/1000 + SHIFT);
        per[d.getDay()] += k*(e - a); tot += k*(e - a); a = e;
      }
    }
    if (tot <= 0) continue;
    used++;
    for (let w = 0; w < 7; w++) if (cnt[w]) acc[w] += (per[w]/cnt[w]) / (tot/WINDOW);
  }
  if (used < 3) return Array(7).fill(1);
  const mean = acc.reduce((a,b) => a + b, 0)/7/used;
  return mean > 0 ? acc.map(x => x/used/mean) : Array(7).fill(1);
}
// Через сколько дней следующий день из списка (1..7)
const nextIn = (wd, list) => { for (let k = 1; k <= 7; k++) if (list.includes((wd + k) % 7)) return k; return 7; };
// Проигрываем 7 дней вперёд по графику барбэка:
//  · готовим только в его смены; у каждой позиции свой «основной» день: настои (маркировка от недели) — первый
//    основной день (Ср), остальное — последний (Чт); там делаем партию до следующего такого же дня с запасом 20%;
//  · в другие смены (Пт, Сб) — только доделать, если не хватит до следующей смены;
//  · фреши (маркировка в часах) — каждый день по расходу;
//  · перемаркировка — в дни перемаркировки (Ср, Сб), фреши — по времени.
function buildPlan(){
  const F = dataDays() >= 7 ? wdFactors() : Array(7).fill(1);
  const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  const days = Array.from({length: 7}, (_, i) => { const d = new Date(d0); d.setDate(d0.getDate() + i); return {t: d.getTime()/1000, wd: d.getDay(), make: [], relabel: []}; });
  const W = workDays().length ? workDays() : [0,1,2,3,4,5,6];
  const order = wd => (wd + 6) % 7; // понедельник — первый
  const M = mainDays().filter(d => W.includes(d)).sort((a,b) => order(a) - order(b));
  const MM = M.length ? M : [...W].sort((a,b) => order(a) - order(b));
  const gap = Math.max(...W.map(w => nextIn(w, W))); // самый длинный перерыв без барбэка (Сб → Ср = 4 дня)
  const norms = [], nodata = [];
  for (const it of S.items) {
    if (!CATS[it.c].own) continue;
    const r = dailyRate(it.id, WINDOW);
    if (!(r > 0)) { nodata.push(it); continue; }
    const fresh = it.lh > 0 && it.lh < 24;
    const home = fresh ? null : !(it.lh > 0) || it.lh >= 24*7 ? MM[0] : MM[MM.length - 1];
    const st = it.step > 0 ? it.step : 0.1;
    const up = x => r3(Math.ceil(x/st - 1e-9)*st);
    const demand = (i, k) => { let s = 0; for (let j = 0; j < k; j++) s += r*F[(days[0].wd + i + j) % 7]; return s; };
    let s = stockAt(it.id) ?? 0;
    const bs = batches(it.id).map(x => ({...x}));
    let times = 0;
    for (let i = 0; i < 7; i++) {
      const day = days[i];
      let cover = 0;
      if (fresh) { if (s < demand(i, 1)*1.2) cover = 1; }
      else if (W.includes(day.wd)) {
        if (day.wd === home) { if (s < demand(i, nextIn(home, [home]))) cover = nextIn(home, [home]); }
        else if (s < demand(i, nextIn(day.wd, W))) cover = nextIn(day.wd, [home]); // доделать до основного дня
      }
      if (cover) {
        const qn = up(Math.max(st, demand(i, cover)*1.2 - s));
        s += qn; times++;
        bs.push({t: day.t + PREP_H*3600, q: qn});
        day.make.push({it, q: qn, extra: !fresh && day.wd !== home});
      }
      if (bySchedule(it)) { // что переклеивать в дни перемаркировки (фреши — на смене по времени, в план не идут)
        let done = false;
        for (const x of bs) {
          if (x.t == null) continue;
          const due = relabelDayFor(x.t, x.t + it.lh*3600);
          if (due === day.t || (i === 0 && due != null && due < day.t)) { x.t = day.t + PREP_H*3600; if (!done) { day.relabel.push({it, t: null}); done = true; } }
        }
      }
      let c = demand(i, 1);
      s = Math.max(0, s - c);
      while (c > 1e-9 && bs.length) { if (bs[0].q <= c) { c -= bs[0].q; bs.shift(); } else { bs[0].q -= c; c = 0; } }
    }
    // норма — на неделю от основного дня (фреши — на день); минимум — чтобы хватило на самый длинный перерыв без барбэка
    norms.push({it, r, home, fresh, times, par: up(r*(fresh ? 1 : 7)*1.2), min: fresh ? null : up(r*gap)});
  }
  for (const d of days) d.relabel.sort((a,b) => (a.t ?? 0) - (b.t ?? 0));
  return {days, norms, nodata, F};
}

      ${d.relabel.length ? `<div class="sub" style="padding:8px 0 2px">Перемаркировать (${d.relabel.length}):</div>` + d.relabel.map(x => `<div class="row"><div class="ri"><div class="nm">${esc(x.it.n)}</div></div><div class="val soon">${d.t === P.days[0].t ? relabelBtn(x.it) : x.t ? fmtT(x.t) : ''}</div></div>`).join('') : ''}</div>`;

  <textarea id="f_bulk" placeholder="[Сувид и инфьюзы]&#10;Джин на лемонграссе; заготовки; л; 30 сут; есть 1&#10;Лайм; продукты; кг; 5; 2; Фрукты-опт"></textarea>
  <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="f_repl" style="width:auto"> Заменить весь список: позиции, которых нет во вставке, удалятся</label>
  <button class="btn" data-act="bulksave">Добавить</button><button class="btn sec" data-act="close">Отмена</button>`);
ACT.bulksave = async () => {
  const cat = s => { s = (s || '').trim().toLowerCase(); return s.startsWith('прем') ? 'premix' : s.startsWith('прод') ? 'prod' : s.startsWith('алк') ? 'alc' : 'prep'; };
  const nn = s => { const x = num(s); return x === null || Number.isNaN(x) ? null : x; };
  const LIFE = /^(\d+(?:[.,]\d+)?)\s*(ч|час|сут|д|дн)/i;
  const STOCK = /^(?:есть|остаток)\s*(\d+(?:[.,]\d+)?)$/i;
  const STEP = /^(?:галочка|✅)\s*=?\s*(\d+(?:[.,]\d+)?)/i;
  const BARTOK = /^(не )?в баре$/i;
  const replace = $('#f_repl').checked;
  const items = [...S.items]; // работаем с копией, чтобы «Отмена» в подтверждении ничего не меняла
  const find = n => items.find(i => i.n.toLowerCase() === n.toLowerCase());
  const seen = new Set(), counts = [];
  let added = 0, updated = 0, recs = 0, cur = null, sec = null, seq = S.seq;
  const lines = $('#f_bulk').value.split('\n');
  const recsData = new Map();
  // История: строка «@ 2026-10-08 17:19», под ней «Название; есть 0,5; приход 0,3» — записи на эту дату
  const HIST = /^@\s*(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)/, RECV = /^приход\s*(\d+(?:[.,]\d+)?)$/i;
  let tAt = null, skipped = 0;
  const hist = [];
  for (const line of lines) {
    const tl = line.trim();
    const hm = tl.match(HIST);
    if (hm) { tAt = Math.floor(new Date(+hm[1], hm[2]-1, +hm[3], +hm[4], +hm[5]).getTime()/1000); cur = null; continue; }
    if (tAt !== null && tl && !tl.startsWith('[') && !tl.startsWith('#')) {
      const p = tl.split(/\t|;/).map(s => s.trim());
      const it = find(p[0]);
      if (!it) { skipped++; continue; }
      for (const s of p.slice(1)) {
        const r = s.match(RECV), k = s.match(STOCK);
        if (r) hist.push([tAt - 60, it.id, 'h', num(r[1])]); // приход чуть раньше пересчёта
        if (k) hist.push([tAt, it.id, 'c', num(k[1])]);
      }
      continue;
    }
    // Раздел: «[Название]» — следующие позиции попадут в него
    if (/^\[.+\]$/.test(tl)) { sec = tl.slice(1, -1).trim(); cur = null; continue; }
    // Блок ТТК: «# Название позиции», затем «Ингредиент; кол-во; ед.» и «Выход; 750» — до пустой строки
    if (tl.startsWith('#')) {
      const n = tl.slice(1).trim();
      if (!n) continue;
      cur = find(n);
      if (!cur) { cur = {id: seq++, n, c: 'premix', g: sec || '', u: 'бут', par: null, min: null, sup: '', mult: null, lh: null}; items.push(cur); added++; }
      seen.add(cur);
      recsData.set(cur, {out: null, ing: []});
      recs++;
      continue;
    }
    if (!tl) { cur = null; continue; }
    if (cur) {
      const m = line.match(/^\s*выход\D*(\d+(?:[.,]\d+)?)/i);
      const r = recsData.get(cur);
      if (m) r.out = num(m[1]);
      else { const ing = parseIng(line); if (ing) r.ing.push(ing); }
      continue;
    }
    let p = line.split(/\t|;/).map(s => s.trim());
    if (!p[0]) continue;
    let lh = null, st = null, step = null, bar = null;
    p = p.filter((s, i) => {
      if (i <= 2) return true;
      const m = s.match(LIFE), k = s.match(STOCK), g = s.match(STEP), b = s.match(BARTOK);
      if (m) lh = num(m[1]) * (m[2].toLowerCase().startsWith('ч') ? 1 : 24);
      if (k) st = num(k[1]);
      if (g) step = num(g[1]);
      if (b) bar = !b[1];
      return !m && !k && !g && !b;
    });
    const data = {n: p[0], c: cat(p[1]), u: p[2] || 'л', par: nn(p[3]), min: nn(p[4]), sup: p[5] || '', mult: nn(p[6]), lh, step, bar};
    let it = find(data.n);
    if (it) {
      if (seen.has(it)) continue;
      it = {...it}; items[items.findIndex(i => i.id === it.id)] = it;
      if (p[1]) it.c = data.c;
      if (p[2]) it.u = data.u;
      for (const k of ['par','min','mult','lh','step','bar']) if (data[k] != null) it[k] = data[k];
      if (data.sup) it.sup = data.sup;
      updated++;
    } else { it = {id: seq++, ...data}; items.push(it); added++; }
    if (sec !== null) it.g = sec;
    seen.add(it);
    if (st != null) counts.push([it.id, st]);
  }
  if (hist.length) {
    // повторная вставка той же истории не задвоит записи
    const have = new Set(Object.values(S.ev).flat().map(e => e.join('|')));
    const fresh = hist.filter(e => !have.has(e.join('|')));
    const months = new Set();
    for (const e of fresh) { const m = monthOf(e[0]); (S.ev[m] || (S.ev[m] = [])).push(e); months.add('e'+m); }
    rebuild(); persist([...months, 'mo']); closeModal(); render();
    toast(`История: ${fresh.length} записей` + (hist.length > fresh.length ? `, уже было: ${hist.length - fresh.length}` : '') + (skipped ? `, не найдено позиций: ${skipped}` : ''));
    if (!added && !updated && !recs) return;
  }
  if (!added && !updated && !recs) { toast('Пусто'); return; }
  const removed = replace ? items.filter(i => !seen.has(i)) : [];
  if (removed.length && !await ask(`Удалить ${removed.length} поз., которых нет во вставке?`)) return;
  for (const [it, r] of recsData) it.rec = r;
  if (replace) S.items = [...seen];
  else {
    // новые и перенесённые в другой раздел позиции — в конец своего раздела
    S.items = items.filter(i => S.items.some(o => o.id === i.id && secOf(o) === secOf(i)));
    for (const it of items) if (!S.items.includes(it)) placeItem(it);
  }
  S.seq = seq;
  const names = ['it'];
  if (counts.length) {
    const t = now(), m = monthOf(t);
    (S.ev[m] || (S.ev[m] = [])).push(...counts.map(([id, q]) => [t, id, 'c', q]));
    rebuild(); names.push('e'+m, 'mo');
  }
  persist(names); closeModal(); render();
  toast(`Добавлено: ${added}` + (updated ? `, обновлено: ${updated}` : '') + (recs ? `, ТТК: ${recs}` : '') + (removed.length ? `, удалено: ${removed.length}` : '') + (counts.length ? `, остатков: ${counts.length}` : ''));
};

  openModal(`<h3>Резервная копия</h3>
    <div class="note">Скопируй и отправь себе в «Избранное» Telegram. Чтобы восстановить или перенести — вставь текст ниже.</div>
    <button class="btn" data-act="copy" data-i="0">Скопировать копию</button>
    <textarea id="f_imp" placeholder="Вставь сюда резервную копию"></textarea>
    <button class="btn danger" data-act="import">Восстановить из вставленного (заменит всё)</button>
    <button class="btn sec" data-act="close">Закрыть</button>`);
};
ACT.import = async () => {
  let v;
  try { v = JSON.parse($('#f_imp').value); } catch(e) { toast('Это не похоже на резервную копию'); return; }
  if (!v || !Array.isArray(v.items) || typeof v.ev !== 'object') { toast('Это не похоже на резервную копию'); return; }
  if (!await ask('Заменить все текущие данные копией?')) return;
  S = {items: v.items, seq: v.seq || 1, invs: v.invs || [], ev: v.ev || {}, cfg: v.cfg || {}};
  rebuild(); persist(allNames()); closeModal(); render(); toast('Восстановлено');
};
ACT.close = () => closeModal();

/* ---------- общее ---------- */
function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#view').innerHTML = VIEWS[tab]();
  updateSaveBar();
}
function openModal(html){
  $('#sheet').innerHTML = html;
  $('#modal').classList.add('on');
  if (IN_TG) TG.BackButton.show();
}
function closeModal(){
  $('#modal').classList.remove('on');
  if (IN_TG) TG.BackButton.hide();
}
function ask(msg){
  return new Promise(r => IN_TG && TG.showConfirm ? TG.showConfirm(msg, ok => r(!!ok)) : r(confirm(msg)));
}
let toastT;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', 2600);
}
function haptic(t){ try { TG.HapticFeedback.notificationOccurred(t); } catch(e) {} }
async function copyText(t){
  try { await navigator.clipboard.writeText(t); toast('Скопировано'); return; } catch(e) {}
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
  ta.remove(); toast(ok ? 'Скопировано' : 'Не получилось скопировать');
}

function onClick(e){
  const b = e.target.closest('[data-act]');
  if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b);
}
$('#view').addEventListener('click', onClick);
$('#savebar').addEventListener('click', onClick);
$('#sheet').addEventListener('click', onClick);
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#sheet').addEventListener('input', e => { if (e.target.id === 'f_k') $('#recbody').innerHTML = recBody(); });
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.tab; render(); window.scrollTo(0, 0);
});
$('#view').addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { q = el.value; $('#list').innerHTML = inputList(); return; }
  if (el.classList.contains('num')) {
    drafts[mode][el.dataset.id] = el.value;
    el.classList.toggle('filled', el.value.trim() !== '');
    updateSaveBar();
  }
});
$('#view').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.classList.contains('num')) return;
  e.preventDefault();
  const all = [...document.querySelectorAll('#list .num')];
  const next = all[all.indexOf(e.target) + 1];
  if (next) next.focus(); else e.target.blur();
});

if (IN_TG) {
  TG.ready(); TG.expand();
  try { TG.disableVerticalSwipes(); } catch(e) {}
  TG.BackButton.onClick(closeModal);
}
loadLocal(); rebuild(); setSync('ok'); render();
if (CLOUD) loadCloud();
</script>
</body>
</html>
